<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenshop - Register</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="register-wrapper">

        <div class="register-form">

            <button class="close-btn" type="button">×</button>

            <div class="tabs">
                <a href="#" class="tab">Login</a>
                <span class="divider">|</span>
                <a href="#" class="tab active">Register</a>
            </div>

            <p class="form-description">
                Enter your email and password to register.
            </p>

            <form>

                <input
                    type="text"
                    class="form-input"
                    placeholder="Username"
                >

                <input
                    type="email"
                    class="form-input"
                    placeholder="Enter your email address"
                >

                <div class="password-wrapper">
                    <input
                        type="password"
                        class="form-input"
                        placeholder="Password"
                    >

                    <button type="button" class="eye-btn">
                        ◉
                    </button>
                </div>

                <input
                    type="password"
                    class="form-input"
                    placeholder="Confirm Password"
                >

                <button type="submit" class="register-btn">
                    Register
                </button>

            </form>

            <div class="social-title">
                <span>Or register with</span>
            </div>

            <button class="social-btn google-btn" type="button">
                <img src="./image/Group.png" alt="google-btn">
                Continue with Google
            </button>

            <button class="social-btn facebook-btn" type="button">
                <img src="./image/facebook 1.png" alt="facebook">
                Continue with Facebook
            </button>
            <div class="checkbox-wrapper">
                 <input type="checkbox" id="agree">

                   <label for="agree">
                     <span class="custom-checkbox"></span>
                     I agree to the Privacy Policy
                  </label>
              </div>

        </div>

    </div>


    





</body>
</html>
